apiVersion: v1
kind: Namespace
metadata:
  name: nexora-healthcare
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
  namespace: nexora-healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:7.0
        ports:
        - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: nexora-healthcare
spec:
  selector:
    app: mongodb
  ports:
  - port: 27017
    targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-backend
  namespace: nexora-healthcare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexora-backend
  template:
    metadata:
      labels:
        app: nexora-backend
    spec:
      containers:
      - name: backend
        image: nexora/backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: MONGODB_URI
          value: "mongodb://mongodb-service:27017"
        - name: MONGODB_DB_NAME
          value: "nexora_db"
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-backend-service
  namespace: nexora-healthcare
spec:
  selector:
    app: nexora-backend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-frontend
  namespace: nexora-healthcare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexora-frontend
  template:
    metadata:
      labels:
        app: nexora-frontend
    spec:
      containers:
      - name: frontend
        image: nexora/frontend:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-frontend-service
  namespace: nexora-healthcare
spec:
  type: LoadBalancer
  selector:
    app: nexora-frontend
  ports:
  - port: 80
    targetPort: 80
