version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: nexora-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - nexora-net

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: nexora-backend
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=nexora_db
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    networks:
      - nexora-net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: nexora-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - nexora-net

  ollama:
    image: ollama/ollama:latest
    container_name: nexora-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - nexora-net

networks:
  nexora-net:
    driver: bridge

volumes:
  mongo-data:
  ollama-models:
